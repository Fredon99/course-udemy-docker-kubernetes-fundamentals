apiVersion: v1
kind: Pod
metadata:
  labels:
    run: worker-pod
  name: worker-pod
  namespace: default
spec:
  terminationGracePeriodSeconds: 10
  containers:
  - image: alpine
    name: alpine
    command:
      - "sleep"
      - "99999999"
    lifecycle:
      preStop:
        exec:
          command:
            - sh
            - -c
            - |
              echo "preStop: iniciando graceful shutdown..." >> /proc/1/fd/1 2>&1
              echo "preStop: removendo pod do load balancer..." >> /proc/1/fd/1 2>&1
              sleep 8
              echo "preStop: concluido" >> /proc/1/fd/1 2>&1

# My pod receive a SIGTERM signal when I delete it.
# The preStop hook will be executed before the pod is terminated.
# After the terminationGracePeriodSeconds, the pod will be forcefully terminated with a SIGKILL signal.