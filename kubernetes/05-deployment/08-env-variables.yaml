apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx-probe
  name: nginx-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-probe
  template:
    metadata:
      labels:
        app: nginx-probe
    spec:
      containers:
      - image: nginx
        name: nginx-probe
        env:
          - name: "ENVIRONMENT"
            value: "development"
          - name: "NAME"
            value: "nginx-probe"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
