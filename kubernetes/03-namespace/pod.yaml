apiVersion: v1
kind: Pod
metadata:
  name: nginx-namespaced
  namespace: learning
  labels:
    app: nginx-namespaced
spec:
  containers:
  - name: nginx-namespaced
    image: nginx:1.14.2
    ports:
    - containerPort: 80

# This pod will run in the learning namespace

